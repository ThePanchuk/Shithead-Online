name: Deploy to IONOS (Shithead)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: 📝 Export patch notes for the portfolio
        run: |
          python3 - <<'EOF'
          import json, re, subprocess
          SKIP = re.compile(r'^(merge\b|docs?\b|wip\b|readme\b|chore\b)|\(docs/|\bdocs/[\w.-]+\.md\b|\bclaude\b|agents\.md', re.I)
          log = subprocess.run(['git', 'log', '-n', '100', '--no-merges', '--abbrev=7', '--format=%h%x1f%cI%x1f%s'],
                               capture_output=True, text=True, check=True).stdout
          notes = []
          for line in log.splitlines():
              sha, date, msg = line.split('\x1f', 2)
              if not SKIP.search(msg):
                  notes.append({'hash': sha, 'msg': msg, 'date': date})
          with open('public/patchnotes.json', 'w', encoding='utf-8') as f:
              json.dump(notes[:5], f, ensure_ascii=False, indent=2)
          print(f'{len(notes[:5])} patch notes written')
          EOF

      - name: 🚀 Deploy to IONOS via SFTP
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          lftp -c "
            set sftp:auto-confirm yes;
            set sftp:connect-program \"ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null\";
            set net:timeout 15;
            set net:max-retries 3;
            open -u \"$FTP_USER\",\"$FTP_PASS\" sftp://\"$FTP_HOST\";
            mirror --reverse --no-perms --parallel=4 ./public/ /dist/shithead/;
            bye
          "

      - name: 🖼️ Replace portfolio screenshots
        if: hashFiles('portfolio/previews/*.png') != ''
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          SLUG: shithead
        run: |
          # Uploads portfolio/previews/<slug>1.png … and deletes this project's numbered
          # screenshots on the server that are no longer in the repo. The folder holds every
          # project's previews, so only <slug><one digit>.png is ever touched.
          command -v lftp >/dev/null || sudo apt-get install -y lftp
          stale=""
          for n in 1 2 3 4 5 6 7 8 9; do
            [ -f "portfolio/previews/$SLUG$n.png" ] || stale="$stale rm -f /dist/images/previews/$SLUG$n.png;"
          done
          lftp -c "
            set sftp:auto-confirm yes;
            set sftp:connect-program \"ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null\";
            set net:timeout 15;
            set net:max-retries 3;
            open -u \"$FTP_USER\",\"$FTP_PASS\" sftp://\"$FTP_HOST\";
            $stale
            set cmd:fail-exit yes;
            mput -O /dist/images/previews/ portfolio/previews/$SLUG[0-9].png;
            bye
          "
